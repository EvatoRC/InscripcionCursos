spring.application.name=inscripcion-cursos
server.port=8080

# Configuracion base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:inscripciondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2 accesible en /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logs AWS (nuevo)
logging.level.software.amazon.awssdk=DEBUG
logging.level.io.awspring.cloud=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/d3a7f4e6-485d-4411-9d1c-3197d9215eab/v2.0
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# ==========================================================
# Configuracion RabbitMQ (colas y mensajes asincronos)
# Los valores se pueden sobreescribir con variables de entorno
# para el despliegue en la instancia EC2 (docker run -e ...)
# ==========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.template.mandatory=true

# Nombres de cola / exchange / routing key para el resumen de inscripcion (Semana 1)
app.rabbitmq.resumen.queue=resumen.inscripcion.queue
app.rabbitmq.resumen.exchange=resumen.inscripcion.exchange
app.rabbitmq.resumen.routing-key=resumen.inscripcion.routingkey
app.rabbitmq.resumen.dlq=resumen.inscripcion.dlq

logging.level.org.springframework.amqp=INFO
