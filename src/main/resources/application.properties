spring.application.name=inscripcion-cursos
server.port=8080

# Configuracion base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:inscripciondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2 accesible en /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logs AWS (nuevo)
logging.level.software.amazon.awssdk=DEBUG
logging.level.io.awspring.cloud=DEBUG
